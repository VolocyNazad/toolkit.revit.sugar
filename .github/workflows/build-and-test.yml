name: Build and test

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [
          "Release_2021.1.100", "Release_2022.1.80", "Release_2023.1.90", "Release_2024.3.60",
          "Release_2025.4.60", "Release_2026.4.10", "Release_2027.3.0"
        ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Build solution
      # tests/Revit.Sugar.RevitTests needs a locally installed, licensed Revit to run (same as
      # revit.linter's *.RevitTests projects) - not runnable on a hosted GitHub Actions runner,
      # so CI compiles the test project but does not invoke `dotnet test`.
      run: |
        dotnet build Toolkit.Revit.Sugar.slnx --configuration "${{ matrix.configuration }}" -p:Platform=x64 /nologo
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: VolocyNazad.Revit.Sugar-${{ matrix.configuration }}
        path: artifacts/*
