name: Build and test

on:
  push:
    branches:
    - main
    - dev
  pull_request:

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ContinuousIntegrationBuild: true

jobs:
  build:
    name: windows-latest
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      matrix:
        configuration: [
          "Release_2021.1.100", "Release_2022.1.80", "Release_2023.1.90", "Release_2024.3.60",
          "Release_2025.4.60", "Release_2026.4.10", "Release_2027.3.0"
        ]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5.4.0
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: |
          global.json
          **/Directory.Packages.props
          NuGet.config
    - name: Build solution
      shell: pwsh
      run: |
        # tests/Revit.Sugar.RevitTests needs a locally installed, licensed Revit to run, so CI
        # compiles the test project but does not invoke the test executable.
        dotnet build Toolkit.Revit.Sugar.slnx --configuration "${{ matrix.configuration }}" -p:Platform=x64 -p:TreatWarningsAsErrors=true -p:EnforcePublicApiDocumentation=true /nologo
        if ($LASTEXITCODE -ne 0) { throw "Build failed for configuration '${{ matrix.configuration }}'." }
    - name: Upload artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: VolocyNazad.Revit.Sugar-${{ matrix.configuration }}
        path: artifacts/*
